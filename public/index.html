
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="topbar">
        <div>
            <h1>Student Management</h1>
            <p>Manage students and course records</p>
        </div>
        <span class="status">Admin Dashboard</span>
    </header>

    <main class="container">
        <section class="stats">
            <div class="stat-card">
                <span>Total Students</span>
                <h2 id="totalStudents">0</h2>
            </div>
            <div class="stat-card">
                <span>Available Courses</span>
                <h2 id="totalCourses">0</h2>
            </div>
        </section>

        <section class="panel">
            <h2 id="formTitle">Add New Student</h2>

            <form id="studentForm">
                <input type="hidden" id="studentId">

                <div class="form-grid">
                    <div class="field">
                        <label for="full_name">Full Name *</label>
                        <input
                            id="full_name"
                            maxlength="100"
                            placeholder="Enter student name"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="email">Email *</label>
                        <input
                            id="email"
                            type="email"
                            maxlength="150"
                            placeholder="student@example.com"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="phone">Phone</label>
                        <input
                            id="phone"
                            type="tel"
                            maxlength="20"
                            placeholder="Enter phone number"
                        >
                    </div>

                    <div class="field">
                        <label for="course_id">Course</label>
                        <select id="course_id">
                            <option value="">Select course</option>
                        </select>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit" id="submitBtn">
                        Add Student
                    </button>

                    <button
                        type="button"
                        id="cancelBtn"
                        class="secondary hidden"
                    >
                        Cancel Edit
                    </button>
                </div>
            </form>

            <p id="message" role="status" aria-live="polite"></p>
        </section>

        <section class="panel">
            <div class="list-heading">
                <div>
                    <h2>Student Records</h2>
                    <p>Search, sort and manage student records</p>
                </div>
            </div>

            <div class="form-grid search-controls">
                <div class="field">
                    <label for="searchInput">Search Students</label>
                    <input
                        id="searchInput"
                        type="search"
                        placeholder="Search name, email, phone or course"
                    >
                </div>

                <div class="field">
                    <label for="sortBy">Sort By</label>
                    <select id="sortBy">
                        <option value="id">Student ID</option>
                        <option value="name">Name</option>
                        <option value="email">Email</option>
                        <option value="phone">Phone</option>
                        <option value="course">Course</option>
                        <option value="date">Created Date</option>
                    </select>
                </div>

                <div class="field">
                    <label for="sortOrder">Sort Order</label>
                    <select id="sortOrder">
                        <option value="ASC">Ascending (A–Z)</option>
                        <option value="DESC" selected>Descending (Z–A)</option>
                    </select>
                </div>
            </div>

            <p id="recordCount" aria-live="polite"></p>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Course</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="studentTable">
                        <tr>
                            <td colspan="6">Loading students...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/js/app.js" defer></script>
</body>
</html>
